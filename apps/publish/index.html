<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Broadcast — publish your event everywhere</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the destinations</a>

    <!-- Not a page header: a console's app bar. One line, always the same
         height, holding only the context the whole tool works against. -->
    <header id="app-bar">
      <a id="brand" href="./" aria-label="Broadcast — back to all destinations">
        <span class="brand-mark" aria-hidden="true">◇</span>
        <span class="brand-name">Broadcast</span>
      </a>

      <button id="event-chip" type="button" hidden aria-haspopup="dialog">
        <span class="chip-label">Publishing</span>
        <span id="event-chip-name">—</span>
        <span id="event-chip-date" class="chip-date"></span>
      </button>

      <span id="feed-chip" class="chip-quiet"></span>
      <span id="app-bar-spacer"></span>
      <button id="theme-toggle" type="button" class="icon-button" aria-label="Switch theme"></button>
    </header>

    <section id="message" class="panel" hidden></section>

    <main id="main" hidden>
      <section id="home-view">
        <section id="favourites" class="group" hidden></section>
        <div id="groups"></div>
        <section id="home-cta" class="panel cta-panel"></section>
      </section>

      <section id="destination-view" hidden>
        <div class="workspace">
          <nav id="sidebar" aria-label="Destinations">
            <div class="sidebar-head">
              <button id="back-home" type="button" class="link-button"></button>
              <button id="sidebar-toggle" type="button" class="icon-button"></button>
            </div>
            <div id="sidebar-list"></div>
          </nav>
          <div id="stage" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <dialog id="event-picker" aria-labelledby="event-picker-title">
      <div class="dialog-head">
        <h2 id="event-picker-title">Which event are you publishing?</h2>
        <button id="event-picker-close" type="button" class="icon-button" aria-label="Close"></button>
      </div>
      <label class="visually-hidden" for="event-filter">Filter events</label>
      <input id="event-filter" type="search" placeholder="Filter by name…" autocomplete="off" />
      <div id="event-list" class="picker-list"></div>
    </dialog>

    <footer>
      <a
        href="https://github.com/OpenTechEvents/ote-tools/issues/new"
        target="_blank"
        rel="noopener"
      >
        Report a problem
      </a>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
