packages:
  - packages/*
  - apps/*
  # Deployed to Cloudflare, not to the tools site: apps/* are static bundles
  # published to GitHub Pages, and a Worker is neither static nor published
  # there. See workers/fetch-url/README.md.
  - workers/*
  # Not shipped and not deployed: the evals for skills/, which drive an agent
  # over frozen fixtures and assert on what it did. A workspace member so it
  # gets the same vitest and tsconfig as everything else.
  - skills/evals
allowBuilds:
  esbuild: true
  # wrangler's local runtime (workers/fetch-url). Its install script downloads
  # a platform binary that nothing in CI needs: the Worker's tests are plain
  # vitest over pure functions and a fake fetch, and `wrangler deploy` bundles
  # with esbuild. Left off so a routine `pnpm install` runs one less install
  # script. Turn it on locally if you want `pnpm --filter @opentechevents/fetch-url dev`
  # (wrangler dev), which does need workerd.
  workerd: false
# TEMPORARY supply-chain exemption, re-created by pnpm on every spec release:
# @opentechevents/schema 0.6.0 was published on 2026-11-03 (by us, from
# OpenTechEvents/opentechevents-spec) and packages/validate pinned it the same
# day, younger than pnpm's minimum release age.
# TODO(2026-11-10): drop this list once 0.6.0 is past that age — `pnpm install
# --frozen-lockfile && pnpm test` must still pass without it. Every entry here
# is a package we install without the cooling-off window that catches
# compromised releases, so it must not become permanent or grow a second line.
minimumReleaseAgeExclude:
  - '@opentechevents/schema@0.6.0'

# Svelte is a transitive dependency of @event-calendar/core and the two are
# tightly coupled, in both directions: the library ships a bundle compiled
# against a particular set of Svelte internals, and imports them by subpath.
# So **moving either version means moving both**, and which pairs work is a
# measurement, not a reading of the semver ranges.
#
# Measured with `apps/embed/test/calendar-layout.test.ts` and
# `calendar-render.test.ts`, and confirmed in a real browser with the built
# widget (2026-11-25, extended 2026-11-26):
#
#   - calendar 5.18.1 + svelte 5.59.1 → the calendar mounts and throws
#     `TypeError: Cannot read properties of undefined (reading 'call')`
#     inside its own compiled template. A visitor gets that sentence where
#     the month should be.
#   - calendar 5.21.2+ + svelte 5.57.3 → the **build** fails:
#     `Could not resolve "svelte/internal/init-operations"`. That subpath is
#     new in the library's 5.21.2 bundle and absent from Svelte 5.57.3's
#     `exports`. This is what a Dependabot bump of the library alone looks
#     like (#192).
#   - calendar 5.18.1 + svelte 5.57.3 → renders. The pin until 2026-11-26.
#   - calendar 5.22.0 + svelte 5.59.1 → renders, and is the pin now. The
#     library asks for `svelte: ^5.59.1`; the exact version is ours to
#     choose because nothing in this repo imports Svelte directly.
#
# Which versions those are today, rather than when this was written:
#
#   grep '"@event-calendar/core"' apps/embed/package.json
#   grep -A1 '^overrides:' pnpm-workspace.yaml
#
# Pinned exactly, because Svelte is not ours to float: a lockfile refresh
# that bumps it silently breaks a public widget's layout, and the
# rendered-calendar tests are what say whether the pair works.
overrides:
  svelte: 5.59.1
