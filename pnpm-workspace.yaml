packages:
  - packages/*
  - apps/*
  # Deployed to Cloudflare, not to the tools site: apps/* are static bundles
  # published to GitHub Pages, and a Worker is neither static nor published
  # there. See workers/fetch-url/README.md.
  - workers/*
  # Not shipped and not deployed: the evals for skills/, which drive an agent
  # over frozen fixtures and assert on what it did. A workspace member so it
  # gets the same vitest and tsconfig as everything else.
  - skills/evals
allowBuilds:
  esbuild: true
  # wrangler's local runtime (workers/fetch-url). Its install script downloads
  # a platform binary that nothing in CI needs: the Worker's tests are plain
  # vitest over pure functions and a fake fetch, and `wrangler deploy` bundles
  # with esbuild. Left off so a routine `pnpm install` runs one less install
  # script. Turn it on locally if you want `pnpm --filter @opentechevents/fetch-url dev`
  # (wrangler dev), which does need workerd.
  workerd: false
