# Dependency bumps as PRs. The one that matters most: @opentechevents/schema in
# packages/validate — when the spec publishes a new schema version, the PR it
# opens here IS the drift alarm (the schemas-generated guard test fails until
# `pnpm gen` re-embeds, making the schema change visible in the diff).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Routine dev tooling in one PR; the schema bump stays its own PR so the
      # drift signal is never buried.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@opentechevents/*"
    ignore:
      # typescript-eslint 8.x refuses to run against the TS 7 API, so a TS 7
      # bump breaks `pnpm lint` for the whole repo. Hold TypeScript at 5.x/6.x
      # until typescript-eslint ships TS >=7 support
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: typescript
        versions: [">=7"]
      # FullCalendar 7 is a re-architecture, not a bump: @fullcalendar/core
      # became a types-only package with a new @full-ui/headless-calendar peer,
      # and daygrid/list/timegrid have no stable 7.x release yet. Skip majors
      # until the whole suite ships 7.x, then migrate apps/preview on purpose.
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
      # @types/node describes the runtime we actually run on, so it tracks
      # `engines` (Node 22) instead of the newest release — ahead of the
      # runtime it would type-check APIs that do not exist in production.
      # Raise this together with engines and the workflows' node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
